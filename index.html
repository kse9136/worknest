<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 대시보드</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --pri1:#ef4444; --pri2:#f59e0b; --pri3:#9ca3af;
  --accent:#4f46e5; --accent-soft:#eef2ff; --done:#10b981;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
h1{font-size:20px;margin:0;}
.status{font-size:12px;color:var(--muted);white-space:nowrap;}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.tab{padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);user-select:none;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tab-extra{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.gsearch-wrap{position:relative;display:flex;align-items:center;}
.gsearch{padding:7px 26px 7px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;width:150px;background:#fff;}
.gsearch:focus{outline:none;border-color:var(--accent);}
.gsearch-clear{position:absolute;right:6px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px;display:none;}
.gsearch-clear.show{display:block;}
#gcat{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:#fff;font-family:inherit;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.periodnav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;}
.period{font-weight:600;font-size:15px;}
.period-center{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;padding:0 6px;}
.jump{padding:5px 6px;font-size:12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;}
.nav-today{padding:5px 10px;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid #dfe3ff;border-radius:8px;cursor:pointer;white-space:nowrap;}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center;}
.addrow input[type=text]{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
select,input[type=date]{padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;font-family:inherit;}
input[type=date]{padding:8px;font-size:13px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
.filters label{display:flex;align-items:center;gap:4px;cursor:pointer;}
.group-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;color:#374151;margin:14px 2px 6px;padding-bottom:5px;border-bottom:1px solid var(--line);}
.group-h .g-pct{font-weight:500;color:var(--muted);font-size:12px;}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.task.done{opacity:.55;}
.task .cb{width:20px;height:20px;margin-top:2px;cursor:pointer;flex-shrink:0;}
.task .body{flex:1;min-width:0;}
.task .title{font-size:15px;word-break:break-word;}
.task.done .title{text-decoration:line-through;}
.task .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.tag.date-tag{background:#f3f4f6;color:#374151;}
.pri{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;}
.memo{width:100%;margin-top:8px;border:1px dashed var(--line);border-radius:8px;padding:7px 8px;font-size:13px;resize:vertical;display:none;font-family:inherit;}
.memo.show{display:block;}
.iconbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:22px;line-height:1.5;}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px;line-height:1.45;background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;}
.stat .num{font-size:26px;font-weight:700;}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3;}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.bar-val{font-size:10px;color:var(--muted);}
.bar{width:70%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;transition:height .2s;}
.bar-lbl{font-size:10px;color:var(--muted);}
.retro textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;min-height:72px;resize:vertical;font-family:inherit;}
@media(max-width:520px){ h1{font-size:18px} .tab{padding:7px 11px;font-size:13px} .gsearch{width:110px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂️ 업무 대시보드</h1>
    <span class="status" id="status">로딩중…</span>
  </header>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="daily">오늘</div>
    <div class="tab" data-tab="weekly">주간</div>
    <div class="tab" data-tab="monthly">월간</div>
    <div class="tab" data-tab="stats">대시보드</div>
    <div class="tab" data-tab="recurring">반복설정</div>
    <div class="tab-extra">
      <div class="gsearch-wrap">
        <input type="text" id="gsearch" class="gsearch" placeholder="🔍 검색 (제목·메모)">
        <button type="button" id="gsearchClear" class="gsearch-clear" title="검색 지우기">✕</button>
      </div>
      <select id="gcat"><option value="">전체 분류</option></select>
    </div>
  </div>
  <div id="view"></div>
</div>

<!-- ================= ★ 여기만 바꿔: 클라우드 동기화(PC+모바일) ================= -->
<script>
const SUPABASE_URL = "https://sljxhjmbfkzxfnizimhe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mXF11f30001p__I2iJDJHQ_tgrwrQEK";
// 둘 다 채우면 → 클라우드 모드(여러 기기 동기화). 비우면 → 이 브라우저에만 저장.
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* 업무 대시보드 v2 — 모든 할 일은 '날짜(date)' 하나로 관리.
   오늘=특정 날짜 / 주간=그 주 롤업 / 월간=그 달 롤업 / 반복=매일·매주·매월 자동생성
   검색어가 있으면 탭과 무관하게 전체 기간(최초 등록~최신) 데이터에서 찾아 보여줌. */

const USE_CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb = null;
if (USE_CLOUD && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));

const Local = {
  read(t){ try{ return JSON.parse(localStorage.getItem('wm_'+t))||[]; }catch(e){ return []; } },
  write(t,a){ localStorage.setItem('wm_'+t, JSON.stringify(a)); },
  async list(t){ return this.read(t); },
  async upsert(t,row){ const a=this.read(t); if(!row.id)row.id=uid(); const i=a.findIndex(x=>x.id===row.id);
    if(i>=0)a[i]={...a[i],...row}; else a.push(row); this.write(t,a); return {...a.find(x=>x.id===row.id)}; },
  async remove(t,id){ this.write(t, this.read(t).filter(x=>x.id!==id)); }
};
const Cloud = {
  async list(t){ const {data,error}=await sb.from(t).select('*'); if(error)throw error; return data||[]; },
  async upsert(t,row){ if(!row.id)row.id=uid(); const {data,error}=await sb.from(t).upsert(row).select().single(); if(error)throw error; return data; },
  async remove(t,id){ const {error}=await sb.from(t).delete().eq('id',id); if(error)throw error; }
};
const Store = USE_CLOUD ? Cloud : Local;

let state = { tab:'daily', tasks:[], templates:[], retros:[], anchor:new Date(), filterCat:'', hideDone:false, searchQuery:'' };
const WD  = ['일','월','화','수','목','금','토'];
const PRI = {1:{c:'var(--pri1)',t:'높음'}, 2:{c:'var(--pri2)',t:'보통'}, 3:{c:'var(--pri3)',t:'낮음'}};

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayYMD=()=>ymd(new Date());
function parseYMD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ const x=new Date(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
function weekEnd(d){ return addDays(weekStart(d),6); }
function monthStart(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function monthEnd(d){ return new Date(d.getFullYear(),d.getMonth()+1,0); }
function eachDay(a,b){ const out=[]; let x=new Date(a); x.setHours(0,0,0,0); const e=new Date(b); e.setHours(0,0,0,0); while(x<=e){ out.push(new Date(x)); x=addDays(x,1);} return out; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function id(x){ return document.getElementById(x); }
function sortTasks(a,b){ return (Number(a.done)-Number(b.done)) || ((a.priority||2)-(b.priority||2)) || String(a.created_at||'').localeCompare(String(b.created_at||'')); }
function isCarry(sc){ return !!sc && !['task','daily','weekly','monthly'].includes(sc); }
function carryInfo(t){ if(!isCarry(t.scope)) return null;
  const g=state.tasks.filter(x=>x.scope===t.scope).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const i=g.findIndex(x=>x.id===t.id); return i>=0?{day:i+1,total:g.length}:null; }
function currentRange(){
  const d=state.anchor;
  if(state.tab==='weekly')  return [weekStart(d), weekEnd(d)];
  if(state.tab==='monthly') return [monthStart(d), monthEnd(d)];
  return [new Date(d), new Date(d)];
}

// 분류 선택박스는 (검색과 별개로) 탭별 화면과 검색결과 화면 양쪽에 공통 적용
function filterByCategory(arr){
  if(!state.filterCat) return arr;
  return arr.filter(t=>(t.category||'')===state.filterCat);
}

async function loadAll(){
  const [tasks,templates,retros]=await Promise.all([Store.list('tasks'),Store.list('templates'),Store.list('retros')]);
  state.tasks=tasks; state.templates=templates; state.retros=retros;
}

function tplMatches(tpl,d){
  const r=tpl.rule||'';
  if(r==='daily') return true;
  if(r.startsWith('weekly:'))  return d.getDay()===Number(r.split(':')[1]);
  if(r.startsWith('monthly:')) return d.getDate()===Number(r.split(':')[1]);
  return false;
}
async function ensureRecurring(startDate,endDate){
  const today=new Date(); today.setHours(0,0,0,0);
  let s=new Date(startDate); s.setHours(0,0,0,0);
  if(s<today) s=today;
  const days=eachDay(s,endDate);
  for(const tpl of state.templates){
    for(const d of days){
      if(!tplMatches(tpl,d)) continue;
      const dk=ymd(d);
      if(state.tasks.some(t=>t.template_id===tpl.id && t.date===dk)) continue;
      try{
        const row=await Store.upsert('tasks',{ id:uid(), title:tpl.title, scope:'task', date:dk,
          category:tpl.category||'', priority:tpl.priority||2, done:false, done_at:null, memo:'',
          template_id:tpl.id, created_at:new Date().toISOString() });
        state.tasks.push(row);
      }catch(e){ console.error('반복 생성 실패', e); }
    }
  }
}

async function render(){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===state.tab));
  refreshGlobalControls();
  const v=id('view');
  // 검색어가 있으면 탭·날짜와 무관하게 전체 기간 검색 결과 화면을 우선 보여줌
  if(state.searchQuery.trim()){ v.innerHTML=renderSearchResults(); bindView(); return; }
  if(state.tab==='stats'){ v.innerHTML=renderStats(); bindView(); return; }
  if(state.tab==='recurring'){ v.innerHTML=renderRecurring(); bindView(); return; }
  const [rs,re]=currentRange();
  await ensureRecurring(rs,re);
  if(state.tab==='daily')       v.innerHTML=renderDaily();
  else if(state.tab==='weekly') v.innerHTML=renderRange('weekly',rs,re);
  else                          v.innerHTML=renderRange('monthly',rs,re);
  bindView();
}

// 상단 '반복설정' 오른쪽 검색창/분류 선택박스 — 옵션 목록만 최신화(입력값은 유지), 지우기(x) 버튼 표시 여부
function refreshGlobalControls(){
  const gcat=id('gcat'); if(gcat){
    const cats=[...new Set(state.tasks.map(t=>t.category).filter(Boolean))];
    gcat.innerHTML = `<option value="">전체 분류</option>` + cats.map(c=>`<option ${state.filterCat===c?'selected':''}>${esc(c)}</option>`).join('');
  }
  const clearBtn=id('gsearchClear'); if(clearBtn) clearBtn.classList.toggle('show', !!state.searchQuery.trim());
}

function periodLabel(){
  const d=state.anchor;
  if(state.tab==='daily')  return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`+(ymd(d)===todayYMD()?' · 오늘':'');
  if(state.tab==='weekly'){ const s=weekStart(d),e=weekEnd(d); return `${s.getMonth()+1}/${s.getDate()} ~ ${e.getMonth()+1}/${e.getDate()} 주간`; }
  return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
}
function navHTML(){
  const d=state.anchor;
  const picker = state.tab==='monthly'
    ? `<input type="month" class="jump" id="jump" value="${d.getFullYear()}-${pad(d.getMonth()+1)}" title="월 선택">`
    : `<input type="date" class="jump" id="jump" value="${ymd(d)}" title="날짜 선택">`;
  const todayLabel = state.tab==='monthly'?'이번달':(state.tab==='weekly'?'이번주':'오늘');
  return `<div class="periodnav">
    <button class="nav-prev">‹</button>
    <div class="period-center"><span class="period">${periodLabel()}</span>${picker}<button class="nav-today">${todayLabel}</button></div>
    <button class="nav-next">›</button>
  </div>`;
}

function taskHTML(t,opt){
  opt=opt||{}; const p=PRI[t.priority||2]; const ci=carryInfo(t);
  return `<div class="task ${t.done?'done':''}" data-id="${t.id}">
    <input type="checkbox" class="cb" ${t.done?'checked':''}>
    <div class="body">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">
        ${opt.dateLabel?`<span class="tag date-tag">${opt.dateLabel}</span>`:''}
        <span class="pri" style="background:${p.c}">${p.t}</span>
        ${t.category?`<span class="tag">${esc(t.category)}</span>`:''}
        ${t.template_id?`<span class="tag" style="background:#f3f4f6;color:#6b7280">반복</span>`:''}
        ${ci?`<span class="tag" style="background:#fef3c7;color:#92400e" title="이어서 진행 중인 일수">${ci.day}일째</span>`:''}
        <button class="iconbtn act-memo">📝</button>
        ${opt.defer?`<button class="iconbtn act-defer" title="원본은 두고 내일에도 같은 일을 복사">📋 내일에도</button>`:''}
        <button class="iconbtn act-del">🗑</button>
      </div>
      <textarea class="memo ${t.memo?'show':''}" placeholder="메모(포커스 해제 시 저장)">${esc(t.memo||'')}</textarea>
    </div>
  </div>`;
}

// 검색: 최초 등록일 ~ 최신일까지 전체 tasks에서 title/memo에 검색어가 포함된 항목을 찾아
// 오래된 날짜 → 최신 날짜 순으로 나열 (각 항목에 날짜 태그 표시, 클릭해서 바로 체크/메모수정/삭제도 가능)
function renderSearchResults(){
  const q=state.searchQuery.trim().toLowerCase();
  let arr=state.tasks.filter(t=>(t.title||'').toLowerCase().includes(q) || (t.memo||'').toLowerCase().includes(q));
  arr=filterByCategory(arr);
  arr=arr.slice().sort((a,b)=> String(a.date).localeCompare(String(b.date)) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
  const catLabel = state.filterCat ? ` · 분류: ${esc(state.filterCat)}` : '';
  if(!arr.length){
    return `<div class="card">
      <div style="font-weight:600;margin-bottom:8px">🔍 "${esc(state.searchQuery)}" 검색 결과${catLabel}</div>
      <div class="empty">일치하는 일정이 없어.</div>
    </div>`;
  }
  const rows = arr.map(t=>{
    const d=parseYMD(t.date);
    const label=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}(${WD[d.getDay()]})`;
    return taskHTML(t,{dateLabel:label});
  }).join('');
  return `<div class="card">
    <div style="font-weight:600;margin-bottom:8px">🔍 "${esc(state.searchQuery)}" 검색 결과${catLabel} — ${arr.length}건 (오래된 순)</div>
    ${rows}
  </div>`;
}

function renderDaily(){
  const day=ymd(state.anchor);
  let arr=state.tasks.filter(t=>t.date===day);
  arr=filterByCategory(arr);
  if(state.hideDone)  arr=arr.filter(t=>!t.done);
  arr.sort(sortTasks);
  const done=arr.filter(t=>t.done).length;
  let html=`<div class="card">
    ${navHTML()}
    <div class="addrow">
      <input type="text" id="ntitle" placeholder="할 일 입력 후 Enter">
      <input type="text" id="ncat" placeholder="분류" style="max-width:100px;flex:0 1 100px">
      <select id="npri"><option value="2">보통</option><option value="1">높음</option><option value="3">낮음</option></select>
      <input type="date" id="ndate" value="${day}" title="언제 할 일인지">
      <button class="btn" id="addbtn">추가</button>
    </div>
    <div class="hint">💡 '언제' 날짜를 <b>내일·나중</b>으로 바꾸면 미래 할 일도 여기서 미리 등록돼(주간·월간에 자동 반영). 못 끝낸 일은 항목의 <b>➡️ 내일로</b>로 넘겨.</div>
    <div class="filters">
      <span>진행 <b>${done}/${arr.length}</b></span>
      <label><input type="checkbox" id="fhide" ${state.hideDone?'checked':''}> 완료 숨기기</label>
    </div>
    ${arr.length?arr.map(t=>taskHTML(t,{defer:true})).join(''):'<div class="empty">할 일이 없어. 위에서 추가해봐.</div>'}
  </div>`;
  html+=retroHTML();
  return html;
}

function renderRange(kind,rs,re){
  const a=ymd(rs), b=ymd(re);
  let arr=state.tasks.filter(t=>t.date>=a && t.date<=b);
  arr=filterByCategory(arr);
  if(state.hideDone)  arr=arr.filter(t=>!t.done);
  const total=arr.length, done=arr.filter(t=>t.done).length, pct=total?Math.round(done/total*100):0;
  const byDate={}; arr.forEach(t=>{ (byDate[t.date]=byDate[t.date]||[]).push(t); });
  const dates=Object.keys(byDate).sort();
  const groups = dates.length ? dates.map(dk=>{
    const d=parseYMD(dk); const g=byDate[dk].sort(sortTasks); const gd=g.filter(t=>t.done).length;
    const mark = dk===todayYMD()?' · 오늘':'';
    return `<div class="group-h"><span>${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})${mark}</span><span class="g-pct">${gd}/${g.length}</span></div>`
         + g.map(t=>taskHTML(t)).join('');
  }).join('') : `<div class="empty">이 기간에 등록된 일정이 없어.<br>'오늘' 탭에서 날짜를 지정해 등록하거나 '반복설정'을 써봐.</div>`;
  return `<div class="card">
    ${navHTML()}
    <div class="filters">
      <span>${kind==='weekly'?'주간':'월간'} 완료율 <b>${pct}%</b> (${done}/${total})</span>
      <label><input type="checkbox" id="fhide" ${state.hideDone?'checked':''}> 완료 숨기기</label>
    </div>
    ${groups}
  </div>`;
}

function retroHTML(){
  const key=ymd(state.anchor); const r=state.retros.find(x=>x.date===key);
  const label = key===todayYMD()?'오늘':`${state.anchor.getMonth()+1}/${state.anchor.getDate()}`;
  return `<div class="card retro">
    <div style="font-weight:600;margin-bottom:8px">✍️ ${label} 회고</div>
    <textarea id="retro" placeholder="오늘 잘된 것 / 안된 것 / 내일 할 것">${esc(r?r.content:'')}</textarea>
    <div style="text-align:right;margin-top:8px"><button class="btn ghost" id="saveretro">저장</button></div>
  </div>`;
}

function dayStats(dk){ const a=state.tasks.filter(t=>t.date===dk); return {total:a.length,done:a.filter(t=>t.done).length}; }
function pctOf(s){ return s.total?Math.round(s.done/s.total*100):0; }
function calcStreak(){ let s=0; for(let i=0;i<365;i++){ const d=new Date(); d.setDate(d.getDate()-i);
  const st=dayStats(ymd(d)); if(st.total===0) continue; if(st.done===st.total) s++; else break; } return s; }
function renderStats(){
  const dToday=dayStats(todayYMD());
  const last7=[...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return ymd(d); });
  const wk=last7.reduce((a,dk)=>{const s=dayStats(dk);a.total+=s.total;a.done+=s.done;return a;},{total:0,done:0});
  const bars=last7.map(dk=>{const s=dayStats(dk); return {dk,pct:pctOf(s),total:s.total};});
  return `<div class="stat-grid">
    <div class="stat"><div class="num">${pctOf(dToday)}%</div><div class="lbl">오늘 완료율<br>${dToday.done}/${dToday.total}</div></div>
    <div class="stat"><div class="num">${wk.total?Math.round(wk.done/wk.total*100):0}%</div><div class="lbl">최근 7일<br>${wk.done}/${wk.total}</div></div>
    <div class="stat"><div class="num">🔥${calcStreak()}</div><div class="lbl">연속 달성일<br>(100% 채운 날)</div></div>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:6px">최근 7일 완료율</div>
    <div class="bars">${bars.map(b=>`<div class="bar-col"><div class="bar-val">${b.total?b.pct+'%':'-'}</div><div class="bar" style="height:${b.pct}%"></div><div class="bar-lbl">${b.dk.slice(5)}</div></div>`).join('')}</div>
  </div>`;
}

function ruleLabel(r){ r=r||''; if(r==='daily')return '매일'; if(r.startsWith('weekly:'))return '매주 '+WD[Number(r.split(':')[1])]+'요일'; if(r.startsWith('monthly:'))return '매월 '+r.split(':')[1]+'일'; return r; }
function renderRecurring(){
  const rows = state.templates.length ? state.templates.map(t=>`<div class="task" data-id="${t.id}"><div class="body">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">
        <span class="pri" style="background:${PRI[t.priority||2].c}">${PRI[t.priority||2].t}</span>
        ${t.category?`<span class="tag">${esc(t.category)}</span>`:''}
        <span class="tag" style="background:#eef2ff;color:#4f46e5">${ruleLabel(t.rule)}</span>
        <button class="iconbtn tpl-del">🗑 삭제</button>
      </div></div></div>`).join('') : '<div class="empty">아직 반복 업무가 없어.</div>';
  return `<div class="card">
    <div style="font-weight:600;margin-bottom:8px">🔁 반복 업무</div>
    <div class="hint">매일 / 매주(요일) / 매월(일자) 반복을 등록하면 해당 날짜에 할 일이 자동 생성돼. 삭제하면 <b>내일 이후 자동생성분만</b> 지워지고, 오늘까지의 기록은 남아. (매월은 28일까지만 — 짧은 달 누락 방지)</div>
    <div class="addrow">
      <input type="text" id="rtitle" placeholder="반복할 일 (예: 주간 보고서)">
      <input type="text" id="rcat" placeholder="분류" style="max-width:90px;flex:0 1 90px">
      <select id="rpri"><option value="2">보통</option><option value="1">높음</option><option value="3">낮음</option></select>
      <select id="rfreq"><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select>
      <select id="rweekday" style="display:none">${WD.map((w,i)=>`<option value="${i}" ${i===1?'selected':''}>${w}요일</option>`).join('')}</select>
      <select id="rmonthday" style="display:none">${[...Array(28)].map((_,i)=>`<option value="${i+1}">${i+1}일</option>`).join('')}</select>
      <button class="btn" id="raddbtn">추가</button>
    </div>
    ${rows}
  </div>`;
}

function shiftAnchor(dir){ const d=new Date(state.anchor);
  if(state.tab==='daily')d.setDate(d.getDate()+dir); else if(state.tab==='weekly')d.setDate(d.getDate()+7*dir); else if(state.tab==='monthly')d.setMonth(d.getMonth()+dir);
  state.anchor=d; }

async function deleteTemplate(tid){
  if(!confirm('반복 업무를 삭제할까?\n(오늘까지 기록은 남고, 내일 이후 자동생성분만 삭제)')) return;
  try{
    await Store.remove('templates',tid);
    const today=todayYMD();
    const future=state.tasks.filter(t=>t.template_id===tid && t.date>today);
    for(const t of future) await Store.remove('tasks',t.id);
    state.templates=state.templates.filter(x=>x.id!==tid);
    state.tasks=state.tasks.filter(t=>!(t.template_id===tid && t.date>today));
    render();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

function bindView(){
  const prev=document.querySelector('.nav-prev'), next=document.querySelector('.nav-next');
  if(prev) prev.onclick=()=>{ shiftAnchor(-1); render(); };
  if(next) next.onclick=()=>{ shiftAnchor(1);  render(); };
  const jump=id('jump'); if(jump) jump.onchange=()=>{ const v=jump.value; if(!v) return;
    state.anchor = state.tab==='monthly' ? new Date(Number(v.slice(0,4)), Number(v.slice(5,7))-1, 1) : parseYMD(v); render(); };
  const todayBtn=document.querySelector('.nav-today'); if(todayBtn) todayBtn.onclick=()=>{ state.anchor=new Date(); render(); };

  const addbtn=id('addbtn');
  if(addbtn){
    const doAdd=async()=>{
      const title=id('ntitle').value.trim(); if(!title) return;
      const cat=id('ncat').value.trim(); const pri=Number(id('npri').value); const date=id('ndate').value||ymd(state.anchor);
      try{
        const row=await Store.upsert('tasks',{ id:uid(), title, scope:'task', date, category:cat, priority:pri,
          done:false, done_at:null, memo:'', template_id:null, created_at:new Date().toISOString() });
        state.tasks.push(row); render();
      }catch(e){ alert('저장 실패: '+e.message); }
    };
    addbtn.onclick=doAdd;
    id('ntitle').addEventListener('keydown',e=>{ if(e.key==='Enter') doAdd(); });
  }

  const fhide=id('fhide'); if(fhide) fhide.onchange=()=>{ state.hideDone=fhide.checked; render(); };

  document.querySelectorAll('.task').forEach(el=>{
    const tid=el.dataset.id;
    const cb=el.querySelector('.cb');
    if(cb) cb.onchange=async()=>{ const t=state.tasks.find(x=>x.id===tid); if(!t)return;
      t.done=cb.checked; t.done_at=cb.checked?new Date().toISOString():null;
      try{ await Store.upsert('tasks',{...t}); }catch(e){ alert('저장 실패: '+e.message); } render(); };
    const mb=el.querySelector('.act-memo'); if(mb) mb.onclick=()=> el.querySelector('.memo').classList.toggle('show');
    const me=el.querySelector('.memo'); if(me) me.addEventListener('change',async()=>{ const t=state.tasks.find(x=>x.id===tid); if(!t)return;
      t.memo=me.value; try{ await Store.upsert('tasks',{...t}); }catch(e){ alert('저장 실패: '+e.message); } });
    const df=el.querySelector('.act-defer'); if(df) df.onclick=async()=>{ const t=state.tasks.find(x=>x.id===tid); if(!t)return;
      const gid = isCarry(t.scope) ? t.scope : uid();
      const target = ymd(addDays(parseYMD(t.date),1));
      if(state.tasks.some(x=>x.scope===gid && x.date===target)){ render(); return; }   // 이미 복사돼 있으면 중복 방지
      try{
        if(t.scope!==gid){ t.scope=gid; await Store.upsert('tasks',{...t}); }           // 원본을 그룹에 묶기(원본 유지)
        const copy={ id:uid(), title:t.title, scope:gid, date:target, category:t.category||'', priority:t.priority||2,
          done:false, done_at:null, memo:'', template_id:null, created_at:new Date().toISOString() };
        const saved=await Store.upsert('tasks',copy); state.tasks.push(saved);
      }catch(e){ alert('복사 실패: '+e.message); }
      render();
    };
    const dl=el.querySelector('.act-del'); if(dl) dl.onclick=async()=>{ if(!confirm('삭제할까?'))return;
      try{ await Store.remove('tasks',tid); }catch(e){ alert('삭제 실패: '+e.message); } state.tasks=state.tasks.filter(x=>x.id!==tid); render(); };
    const tpl=el.querySelector('.tpl-del'); if(tpl) tpl.onclick=()=>deleteTemplate(tid);
  });

  const sr=id('saveretro');
  if(sr) sr.onclick=async()=>{ const key=ymd(state.anchor); const content=id('retro').value;
    let r=state.retros.find(x=>x.date===key);
    try{ if(r){ r.content=content; await Store.upsert('retros',{...r}); }
         else { r=await Store.upsert('retros',{id:uid(),date:key,content,created_at:new Date().toISOString()}); state.retros.push(r); }
         sr.textContent='저장됨 ✓'; setTimeout(()=>sr.textContent='저장',1200);
    }catch(e){ alert('저장 실패: '+e.message); } };

  const rfreq=id('rfreq');
  if(rfreq){
    const sync=()=>{ id('rweekday').style.display=rfreq.value==='weekly'?'':'none'; id('rmonthday').style.display=rfreq.value==='monthly'?'':'none'; };
    rfreq.onchange=sync; sync();
    id('raddbtn').onclick=async()=>{
      const title=id('rtitle').value.trim(); if(!title) return;
      const cat=id('rcat').value.trim(); const pri=Number(id('rpri').value);
      let rule='daily';
      if(rfreq.value==='weekly')  rule='weekly:'+id('rweekday').value;
      else if(rfreq.value==='monthly') rule='monthly:'+id('rmonthday').value;
      try{
        const row=await Store.upsert('templates',{ id:uid(), title, scope:'task', category:cat, priority:pri, rule, created_at:new Date().toISOString() });
        state.templates.push(row);
        await ensureRecurring(new Date(), addDays(new Date(),45));
        render();
      }catch(e){ alert('저장 실패: '+e.message); }
    };
  }
}

(async function init(){
  const st=id('status');
  try{ await loadAll(); st.textContent=USE_CLOUD?'☁️ 클라우드 동기화':'💾 로컬 저장(이 브라우저)'; }
  catch(e){ st.textContent='⚠️ 연결 오류'; alert('데이터 로드 오류: '+e.message); }
  id('tabs').addEventListener('click',e=>{ const el=e.target.closest('.tab'); if(!el)return; state.tab=el.dataset.tab; render(); });

  // 상단 검색/분류 필터 (반복설정 탭 오른쪽)
  let searchTimer=null;
  id('gsearch').addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{ state.searchQuery=id('gsearch').value; render(); },150);
  });
  id('gsearchClear').addEventListener('click',()=>{ id('gsearch').value=''; state.searchQuery=''; render(); id('gsearch').focus(); });
  id('gcat').addEventListener('change',()=>{ state.filterCat=id('gcat').value; render(); });

  render();
})();
</script>
</body>
</html>
